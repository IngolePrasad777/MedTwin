spring:
  application:
    name: medtwin-backend
  
  datasource:
    url: jdbc:h2:mem:medtwindb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# MedTwin Configuration
medtwin:
  simulation:
    default-duration: 24
    time-step: 1
  ai:
    confidence-threshold: 0.85
    risk-threshold: 30
  compliance:
    standards:
      - IEC-60601-1
      - IEC-62304
      - ISO-14971
      - ISO-13485

logging:
  level:
    com.medtwin: DEBUG
    org.springframework.web: INFO
